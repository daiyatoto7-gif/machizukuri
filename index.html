<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kingdom Builder 3D (Visual Update)</title>

    <link rel="stylesheet" href="style.css">

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
</head>

<body>

    <div id="debug-log"></div>
    <div id="toast-notification"></div>

    <div id="loading-screen">
        <div class="loader"></div>
        <div id="loading-text" style="font-weight:bold; color:#2c3e50;">Connecting to Cloud...</div>
    </div>

    <div id="menu-btn" onclick="openMenu()">≡</div>

    <header>
        <div class="status-bar">
            <div class="rank-badge">RANK <span id="display-rank">1</span></div>
            <div class="xp-container">
                <div class="xp-fill" id="display-xp-bar"></div>
            </div>
            <div style="font-size:0.8em; color:#7f8c8d;">Next: <span id="display-next-xp">0</span> XP</div>
        </div>
        <div class="resource-bar">
            <div class="res-item">💰 <span id="display-money">0</span></div>
            <div class="res-item">🌾 <span id="display-food">0</span></div>
            <div class="res-item">🌲 <span id="display-wood">0</span></div>
            <div class="res-item">🪨 <span id="display-stone">0</span></div>
            <div class="res-item">🔩 <span id="display-iron">0</span></div>
            <div class="res-item">💧 <span id="display-water">0</span></div>
            <div class="res-item" style="border-left:1px solid #ddd; padding-left:10px; color:#e67e22;">👷 <span
                    id="display-builders">0/4</span></div>
        </div>
    </header>

    <div id="game-container"></div>
    <div id="ui-overlay-layer"></div>

    <div id="control-panel">
        <div id="panel-header">
            <h2 id="panel-title">タイル選択</h2>
            <div class="close-btn" onclick="closePanel()">✕</div>
        </div>
        <div id="panel-content"></div>
    </div>

    <!-- 移動モード用のガイドバー -->
    <div id="action-mode-bar">
        <span id="action-mode-text">移動する施設を選択してください</span>
        <div style="display:flex; gap:10px;">
            <button id="action-rotate-btn" class="action-btn" onclick="actRotate()"
                style="background-color:#3498db; display:none; padding:5px 15px;">🔄 回転</button>
            <button class="action-btn" onclick="cancelMoveMode()"
                style="background-color:#e74c3c; padding:5px 15px;">終了</button>
        </div>
    </div>

    <div id="modal-offline" class="modal">
        <div class="modal-content">
            <h3>おかえりなさい！</h3>
            <p>不在の間に生産された資源が<br>貯蔵庫に保管されました。</p>
            <div style="text-align:left; background:#f9f9f9; padding:10px; border-radius:5px; margin:10px 0;">
                <div id="offline-report"></div>
            </div>
            <button onclick="closeModal('modal-offline')" class="action-btn">再開する</button>
        </div>
    </div>

    <div id="modal-levelup" class="modal">
        <div class="modal-content">
            <h3 style="color:var(--accent-color);">🎉 ランクアップ！ 🎉</h3>
            <p style="font-size:1.2em; font-weight:bold;">RANK <span id="levelup-rank"></span> になりました！</p>
            <button onclick="closeModal('modal-levelup')" class="action-btn">閉じる</button>
        </div>
    </div>

    <div id="modal-confirm" class="modal" style="z-index:200;">
        <div class="modal-content">
            <h3 id="modal-confirm-title">確認</h3>
            <p id="modal-confirm-msg" style="margin:20px 0; line-height:1.5;"></p>
            <div style="display:flex; justify-content:space-around; margin-top:20px;">
                <button id="modal-confirm-yes" class="action-btn" style="width:100px;">はい</button>
                <button onclick="closeModal('modal-confirm')" class="action-btn"
                    style="width:100px; background-color:#95a5a6;">いいえ</button>
            </div>
        </div>
    </div>

    <div id="modal-menu" class="modal">
        <div class="modal-content">
            <h3 style="margin-top:0;">メニュー</h3>
            <div id="menu-content" style="max-height:60vh; overflow-y:auto;"></div>
            <button onclick="closeModal('modal-menu')" class="action-btn"
                style="background-color:#95a5a6; margin-top:20px;">閉じる</button>
        </div>
    </div>

    <!-- 施設一覧用モーダル -->
    <div id="modal-building-list" class="modal">
        <div class="modal-content"
            style="max-width:500px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column;">
            <h3 style="margin-top:0;">📋 施設一覧</h3>
            <div id="building-list-content" style="flex:1; overflow-y:auto; text-align:left;"></div>
            <button onclick="closeModal('modal-building-list')" class="action-btn"
                style="background-color:#95a5a6; margin-top:10px;">閉じる</button>
        </div>
    </div>

    <div id="modal-catalog" class="modal">
        <div class="modal-content"
            style="max-width:500px; max-height:80vh; overflow:hidden; display:flex; flex-direction:column; background-color:#f8f9fa;">
            <h3 style="margin-top:0; color:#2c3e50;">📖 建設カタログ</h3>
            <div id="catalog-content" style="flex:1; overflow-y:auto; text-align:left; padding:5px;"></div>
            <button onclick="closeModal('modal-catalog')" class="action-btn"
                style="background-color:#95a5a6; margin-top:10px;">閉じる</button>
        </div>
    </div>

    <!-- JS読み込み順: data.js → ui.js → game.js -->
    <script src="data.js"></script>
    <script src="ui.js"></script>
    <script type="module" src="game.js"></script>

</body>

</html>
